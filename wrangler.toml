name = "purple-fireflies-website"
main = ".open-next/worker.js"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "purple_fireflies_db"
database_name = "purple-fireflies-db"
database_id = "295c9661-624c-4964-8d1f-69f6c991a4f0"

[[kv_namespaces]]
binding = "PURPLE_FIREFLIES_KV"
id = "c7014b56c6d343e8a223d8a41d034731"

# Community Pet Fund photos. The bucket is private; images are served by the
# Worker at /api/media/[...key], never by a public bucket domain.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "purple-fireflies-media"

[vars]
# Running total of boxes delivered by Springfield Neighbors volunteers, shown on
# /programs/springfield-neighbors. Manually bumped; not a D1 aggregate.
SPRINGFIELD_BOXES_DELIVERED = "130"
# Community Pet Fund launch state. Production stays off until the Ohio AG
# registration, Givebutter onboarding, and board policies are in place, and the
# tax line stays state-only until a 501(c)(3) determination letter exists.
COMMUNITY_PETS_DONATIONS_ENABLED = "false"
NONPROFIT_STATUS = "state_only"

# Same Worker as production on purpose. Cloudflare has one Worker with two
# environments, not a separate preview Worker: Workers Builds uploads a version
# with the preview bindings below and a branch alias, and that version reads the
# same secret store as production. Never run `wrangler deploy --env preview`
# here, because with a shared name it would move production traffic.
# `wrangler versions upload --env preview` is the safe command.
[env.preview]
name = "purple-fireflies-website"
workers_dev = true

[env.preview.vars]
SPRINGFIELD_BOXES_DELIVERED = "130"
# Preview differs on purpose: donations are on so the sponsor block can be
# exercised before launch, and the tax line is still state-only because a
# preview deploy is not a 501(c)(3) either.
COMMUNITY_PETS_DONATIONS_ENABLED = "true"
NONPROFIT_STATUS = "state_only"

[[env.preview.d1_databases]]
binding = "purple_fireflies_db"
database_name = "purple-fireflies-db-preview"
database_id = "dcb6e0de-2d20-40bc-82c3-1ccd96f0a540"

[[env.preview.kv_namespaces]]
binding = "PURPLE_FIREFLIES_KV"
id = "88406a0a7e974df5a9203b64977bab25"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "purple-fireflies-media-preview"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
