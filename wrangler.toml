name = "purple-fireflies-website"
main = ".open-next/worker.js"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "purple_fireflies_db"
database_name = "purple-fireflies-db"
database_id = "295c9661-624c-4964-8d1f-69f6c991a4f0"

[[kv_namespaces]]
binding = "PURPLE_FIREFLIES_KV"
id = "c7014b56c6d343e8a223d8a41d034731"

# Community Pet Fund photos. The bucket is private; images are served by the
# Worker at /api/media/[...key], never by a public bucket domain.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "purple-fireflies-media"

[vars]
# Running total of boxes delivered by Springfield Neighbors volunteers, shown on
# /programs/springfield-neighbors. Manually bumped; not a D1 aggregate.
SPRINGFIELD_BOXES_DELIVERED = "130"

[env.preview]
name = "purple-fireflies-website-preview"
workers_dev = true

[env.preview.vars]
SPRINGFIELD_BOXES_DELIVERED = "130"

[[env.preview.d1_databases]]
binding = "purple_fireflies_db"
database_name = "purple-fireflies-db-preview"
database_id = "dcb6e0de-2d20-40bc-82c3-1ccd96f0a540"

[[env.preview.kv_namespaces]]
binding = "PURPLE_FIREFLIES_KV"
id = "88406a0a7e974df5a9203b64977bab25"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "purple-fireflies-media-preview"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
