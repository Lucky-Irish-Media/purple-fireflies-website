# Local-development-only config pointing the Next.js dev server at the
# *preview* Cloudflare resources (D1/KV/R2) with remote bindings.
# Never deploy this file: it has no `main` and is not used by Workers Builds.
name = "purple-fireflies-website-preview-dev"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "purple_fireflies_db"
database_name = "purple-fireflies-db-preview"
database_id = "dcb6e0de-2d20-40bc-82c3-1ccd96f0a540"
remote = true

[[kv_namespaces]]
binding = "PURPLE_FIREFLIES_KV"
id = "88406a0a7e974df5a9203b64977bab25"
remote = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "purple-fireflies-media-preview"
remote = true

[vars]
SPRINGFIELD_BOXES_DELIVERED = "130"
COMMUNITY_PETS_DONATIONS_ENABLED = "true"
NONPROFIT_STATUS = "state_only"
GIVEBUTTER_WIDGET_ACCOUNT_ID = "WCsdHvZKyriW1GgL"
